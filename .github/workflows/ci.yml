name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      # The action bundle is committed on release; fail CI if it drifts from src.
      - name: Verify bundled action is up to date
        run: git diff --exit-code -- action/index.cjs || (echo "action/index.cjs is stale — run 'npm run build' and commit" && exit 1)
