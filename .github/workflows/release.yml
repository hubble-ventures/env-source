name: Release

on:
  push:
    # Semver tags only (e.g. v0.2.1) — publishing a version. The floating major
    # tag `v1` (moved to point the Action at a release) must NOT re-trigger a
    # publish, so it is intentionally excluded by this pattern.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing (and provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; guarantee it regardless of the
      # version bundled with Node.
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm test
      - run: npm run build
      # No NODE_AUTH_TOKEN: npm authenticates via this workflow's OIDC identity.
      # Configure the trusted publisher on npmjs.com first (org: hubble-ventures,
      # repo: env-source, workflow: release.yml). Provenance is automatic.
      - run: npm publish --provenance --access public
