name: Release

on:
  push:
    # Semver tags only (e.g. v0.2.1) — publishing a version. The floating major
    # tag `v1` (moved to point the Action at a release) must NOT re-trigger a
    # publish, so it is intentionally excluded by this pattern.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # push the floating major tag + create the GitHub Release
  id-token: write # OIDC for npm trusted publishing (and provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; guarantee it regardless of the
      # version bundled with Node.
      - run: npm install -g npm@latest
      # The tag IS the version. Stamp it into package.json in the runner only
      # (never committed) — the repo keeps a `0.0.0` placeholder, so a release is
      # just a tag push with no version-bump commit. `npm pkg set` edits the file
      # without running lifecycle scripts.
      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set version="$VERSION"
          echo "Releasing $VERSION"
      - run: npm install
      - run: npm test
      - run: npm run build
      # No NODE_AUTH_TOKEN: npm authenticates via this workflow's OIDC identity.
      # Configure the trusted publisher on npmjs.com first (org: hubble-ventures,
      # repo: env-source, workflow: release.yml). Provenance is automatic.
      - run: npm publish --provenance --access public
      # Point the floating major tag at this release so
      # `uses: hubble-ventures/env-source@v1` resolves to it. Hard-coded to `v1`
      # (not derived from the version) so a breaking change to the action
      # interface is a deliberate move to `v2`, never an automatic one.
      - name: Update floating major tag (v1)
        run: |
          git tag -f v1 HEAD
          git push -f origin v1
      # Publish a GitHub Release for this tag with auto-generated notes.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
